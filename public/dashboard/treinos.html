<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="../assets/img/icone.png"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitMatch | Meus Treinos</title>
    <link rel="stylesheet" href="../css/treinos.css" />
  </head>
  <body onload="buscarTreinos()">
    <div class="sidebar">
      <div class="left">
        <aside>
          <div class="top">
            <div class="logo">
              <img src="../assets/img/fitmatch.png" alt="FitMatch Logo" />
            </div>

            <div class="content-sidebar">
              <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
              </div>

              <div class="links-container">
                <div class="link" onclick="window.location.href = 'index.html'">
                  <span>Dashboard</span>
                </div>

                <div class="link-selected">
                  <span>Meus Treinos</span>
                </div>

                <div
                  class="link"
                  onclick="window.location.href = 'meuperfil.html'"
                >
                  <span>Meu Perfil</span>
                </div>

                <div class="btn-logout" onclick="limparSessao()">
                  <h3>Sair</h3>
                </div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <main>
      <div class="page-title">
        <h1>Meus Treinos</h1>
        <p>Seu plano personalizado — Semana atual</p>
      </div>

      <div class="treino-card">
        <div class="treino-header" onclick="abrirTreino('treinoA')">
          <div class="treino-left">
            <div class="letra-treino azul">A</div>

            <div class="treino-info">
              <h2 id="tituloA">Treino A</h2>
              <p id="qtdA">0 exercícios</p>
            </div>
          </div>
        </div>

        <div class="treino-conteudo" id="treinoA">
          <div class="tabela-header">
            <span class="col-exercicio">EXERCÍCIO</span>
            <span>SÉRIES</span>
            <span>REPETIÇÕES</span>
          </div>

          <div id="listaTreinoA"></div>

          <div class="cardio">
            <p id="cardioA"></p>
            <span>30 min</span>
          </div>
        </div>
      </div>

      <div class="treino-card">
        <div class="treino-header verde" onclick="abrirTreino('treinoB')">
          <div class="treino-left">
            <div class="letra-treino verde-box">B</div>

            <div class="treino-info">
              <h2 id="tituloB">Treino B</h2>
              <p id="qtdB">0 exercícios</p>
            </div>
          </div>
        </div>

        <div class="treino-conteudo" id="treinoB">
          <div class="tabela-header">
            <span class="col-exercicio">EXERCÍCIO</span>
            <span>SÉRIES</span>
            <span>REPETIÇÕES</span>
          </div>

          <div id="listaTreinoB"></div>

          <div class="cardio">
            <p id="cardioB"></p>
            <span>30 min</span>
          </div>
        </div>
      </div>

      <div class="treino-card">
        <div class="treino-header vermelho" onclick="abrirTreino('treinoC')">
          <div class="treino-left">
            <div class="letra-treino vermelho-box">c</div>

            <div class="treino-info">
              <h2 id="tituloC">Treino C</h2>
              <p id="qtdC">0 exercícios</p>
            </div>
          </div>
        </div>

        <div class="treino-conteudo" id="treinoC">
          <div class="tabela-header">
            <span class="col-exercicio">EXERCÍCIO</span>
            <span>SÉRIES</span>
            <span>REPETIÇÕES</span>
          </div>

          <div id="listaTreinoC"></div>

          <div class="cardio">
            <p id="cardioC"></p>
            <span>30 min</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
<script src="../js/sessao.js"></script>
<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

  buscarTreinos();

  function buscarTreinos() {
    console.log("ID USUARIO:", sessionStorage.ID_USUARIO);
    
    fetch(`/treinos/buscarTreinos/${sessionStorage.ID_USUARIO}`)
      .then(function (resposta) {
        return resposta.json();
      })
      .then(function (dados) {
        console.log(dados);

        let treinoA = [];
        let treinoB = [];
        let treinoC = [];

        for (let i = 0; i < dados.length; i++) {
          if (dados[i].divisao == "A") {
            treinoA.push(dados[i]);
          } else if (dados[i].divisao == "B") {
            treinoB.push(dados[i]);
          } else if (dados[i].divisao == "C") {
            treinoC.push(dados[i]);
          }
        }

        preencherTreino("A", treinoA);
        preencherTreino("B", treinoB);
        preencherTreino("C", treinoC);
      })

      .catch(function (erro) {
        console.log("Erro:", erro);
      });
  }

  function preencherTreino(letra, treino) {
    if (treino.length == 0) {
      return;
    }

    document.getElementById(`titulo${letra}`).innerHTML =
      `Treino ${letra} — ${treino[0].musculos}`;

    document.getElementById(`qtd${letra}`).innerHTML =
      `${treino.length} exercícios`;

    document.getElementById(`cardio${letra}`).innerHTML =
      `Cardio: ${treino[0].cardio}`;

    let htmlExercicios = "";

    for (let i = 0; i < treino.length; i++) {
      htmlExercicios += `
      <div class="linha-exercicio">
        <p class="col-exercicio">${treino[i].exercicio}</p>
        <span>${treino[i].series}</span>
        <span>${treino[i].repeticoes}</span>
      </div>
    `;
    }

    document.getElementById(`listaTreino${letra}`).innerHTML = htmlExercicios;
  }

  function abrirTreino(id) {
    let treino = document.getElementById(id);

    if (treino.style.display == "block") {
      treino.style.display = "none";
    } else {
      treino.style.display = "block";
    }
  }
</script>
