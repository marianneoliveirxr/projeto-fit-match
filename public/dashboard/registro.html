<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="../assets/img/icone.png"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/registro.css" />
    <title>Registro Semanal</title>
  </head>

  <body>
  <div class="register-container">

    <div class="logo">
      <img src="../assets/img/fitmatch.png" alt="FitMatch Logo" />
      <p class="logo-titulo">FEITO PARA A SUA EVOLUÇÃO</p>
    </div>

    <div class="register-card">

      <div class="card-header">
        <h4>Registro Semanal</h4>
        <p>Atualize seu progresso semanal</p>
      </div>

      <div class="input-group">
        <label>PESO ATUAL (KG)</label>
        <input type="number" placeholder="Ex: 62.5" />
      </div>

      <div class="input-group">
        <label>ALTURA ATUAL (CM)</label>
        <input type="number" placeholder="Ex: 165" />
      </div>

      <div class="input-group">
        <label>META DE PESO</label>
        <input type="text" placeholder="Ex: 50kg" />
      </div>

      <button onclick="atualizar()">ATUALIZAR</button>
    </div>
  </div>
</body>
</html>
