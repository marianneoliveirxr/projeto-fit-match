<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="../assets/img/icone.png"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/registro.css" />
    <title>Registro Semanal</title>
  </head>

  <body>
  <div class="register-container">

    <div class="logo">
      <img src="../assets/img/fitmatch.png" alt="FitMatch Logo" />
      <p class="logo-titulo">FEITO PARA A SUA EVOLUÇÃO</p>
    </div>

    <div class="register-card">

      <div class="card-header">
        <h4>Registro Semanal</h4>
        <p>Atualize seu progresso semanal</p>
      </div>

      <div class="input-group">
        <label>PESO ATUAL (KG)</label>
        <input type="number" id="ipt_peso" placeholder="Ex: 62.5" />
      </div>

      <div class="input-group">
        <label>ALTURA ATUAL (CM)</label>
        <input type="number" id="ipt_altura" placeholder="Ex: 165" />
      </div>

      <div class="input-group">
        <label>META DE PESO</label>
        <input type="text" placeholder="Ex: 50kg" id="ipt_meta"/>
      </div>

      <button onclick="atualizar()">ATUALIZAR</button>
    </div>
  </div>
</body>
</html>
<script>
    function atualizar() {

    var peso = Number(ipt_peso.value);
    var altura = Number(ipt_altura.value);
    var meta = Number(ipt_meta.value);

    if (peso <= 0 || altura <= 0) {
        alert("Preencha os campos corretamente");
        return;
    }

    fetch("/dash/atualizarPeso", {
        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            id_usuario: sessionStorage.ID_USUARIO,
            peso: peso,
            altura: altura,
            meta: meta
        })
    })

    .then(function(resposta) {

        if (resposta.ok) {

            alert("Atualização realizada com sucesso!");

            window.location = "index.html";
        }
        else {
            throw "Erro ao atualizar";
        }

    })

    .catch(function(erro) {
        console.log(erro);
    });
}
</script>
