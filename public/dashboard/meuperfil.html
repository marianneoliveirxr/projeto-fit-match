<!doctype html>
<html lang="pt-br">
  <head>
    <link
      rel="shortcut icon"
      href="../assets/img/icone.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitMatch | Meu Perfil</title>
    <link rel="stylesheet" href="../css/meuperfil.css" />
    <script src="../js/sessao.js"></script>
  </head>
  <body onload="recarregar()">
    <div class="barra-lateral">
      <div class="esquerda">
        <aside>
          <div class="topo">
            <div class="logo">
              <img src="../assets/img/fitmatch.png" alt="FitMatch Logo" />
            </div>

            <div class="conteudo-lateral">
              <div class="saudacao">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
              </div>

              <div class="container-links">
                <div class="link-menu" onclick="window.location.href = 'index.html'">
                  <span>Dashboard</span>
                </div>

                <div
                  class="link-menu"
                  onclick="window.location.href = 'treinos.html'"
                >
                  <span>Meus Treinos</span>
                </div>

                <div
                  class="link-selecionado"
                  onclick="window.location.href = 'meuperfil.html'"
                >
                  <span>Meu Perfil</span>
                </div>

                <div class="btn-sair" onclick="limparSessao()">
                  <h3>Sair</h3>
                </div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <main>
      <div class="titulo-pagina">
        <h1>Meu Perfil</h1>
      </div>

      <div class="cartao-perfil">
        <div class="cabecalho-cartao">
          <span>PERFIL</span>
        </div>

        <div class="topo-perfil">
          <div class="foto-perfil" id="foto_perfil"></div>

          <div class="info-perfil">
            <h2 id="b_nome"></h2>
          </div>
        </div>

        <div class="grade-perfil">
          <div class="caixa-info">
            <span>ALTURA (CM)</span>
            <h3 id="altura"></h3>
          </div>

          <div class="caixa-info">
            <span>PESO ATUAL (KG)</span>
            <h3 id="peso"></h3>
          </div>

          <div class="caixa-info">
            <span>OBJETIVO</span>
            <h3 id="objetivo"></h3>
          </div>
        </div>
      </div>

    </main>
  </body>
</html>

<script src="../js/sessao.js"></script>
<script>
  let nomeUsuario = sessionStorage.NOME_USUARIO;

  b_usuario.innerHTML = nomeUsuario;
  b_nome.innerHTML = nomeUsuario;

  function recarregar(){

    if(nomeUsuario && nomeUsuario.length > 0){
      foto_perfil.innerHTML = nomeUsuario[0].toUpperCase();
    }
    else{
      foto_perfil.innerHTML = "U";
    }
    
    fetch(`/dash/buscarDadosPerfil/${sessionStorage.ID_USUARIO}`)
    .then(function (resposta){
      return resposta.json()
    })
    .then(function (dados){
      console.log(dados);

      for(let i = 0; i < dados.length; i++){
        peso.innerHTML = dados[0].peso;
        altura.innerHTML = dados[0].altura;
        objetivo.innerHTML = dados[0].objetivo;
      }
    })
    .catch(function (erro){
        console.log("Erro ao buscar treino do dia:", erro)
      });


    let pesoInicialBanco;
    let pesoAtualBanco;
    let metaBanco;

    fetch(`/dash/buscarPesoInicial/${sessionStorage.ID_USUARIO}`)
    .then(res=>res.json())
    .then(dados=>{

      pesoInicialBanco = dados[0].peso;

      pesoInicial.innerHTML = `Início: ${pesoInicialBanco}kg`
    })

  }
  
</script>
