<!doctype html>
<html lang="pt-br">
  <head>
    <link
      rel="shortcut icon"
      href="../assets/img/icone.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitMatch | Meu Perfil</title>
    <link rel="stylesheet" href="../css/meuperfil.css" />
    <script src="../js/sessao.js"></script>
  </head>
  <body onload="recarregar()">
    <div class="sidebar">
      <div class="left">
        <aside>
          <div class="top">
            <div class="logo">
              <img src="../assets/img/fitmatch.png" alt="FitMatch Logo" />
            </div>

            <div class="content-sidebar">
              <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
              </div>

              <div class="links-container">
                <div class="link" onclick="window.location.href = 'index.html'">
                  <span>Dashboard</span>
                </div>

                <div
                  class="link"
                  onclick="window.location.href = 'treinos.html'"
                >
                  <span>Meus Treinos</span>
                </div>

                <div
                  class="link-selected"
                  onclick="window.location.href = 'meuperfil.html'"
                >
                  <span>Meu Perfil</span>
                </div>

                <div class="btn-logout" onclick="limparSessao()">
                  <h3>Sair</h3>
                </div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <main>
      <div class="page-title">
        <h1>Meu Perfil</h1>
        <p>Gerencie seus dados e acompanhe suas metas.</p>
      </div>

      <div class="profile-card">
        <div class="card-header">
          <span>PERFIL</span>
        </div>

        <div class="profile-top">
          <div class="avatar">A</div>

          <div class="profile-info">
            <h2 id="b_nome"></h2>
          </div>
        </div>

        <div class="profile-grid">
          <div class="info-box">
            <span>ALTURA (CM)</span>
            <h3 id="altura"></h3>
          </div>

          <div class="info-box">
            <span>PESO ATUAL (KG)</span>
            <h3 id="peso"></h3>
          </div>

          <div class="info-box">
            <span>OBJETIVO</span>
            <h3 id="objetivo"></h3>
          </div>
        </div>
      </div>

      <div class="meta-container">
        <div class="meta-header">
          <span>METAS</span>
        </div>

        <div class="meta-info">
          <span class="meta-title">META DE PESO</span>

          <h2 id="metaPeso"><span>kg</span></h2>

          <p id="pesoInicial"></p>
        </div>

        <div class="progress-area">
          <div class="progress-bar">
            <div class="progress-fill" id="barra"></div>
          </div>

          <div class="progress-labels">
            <span>Peso inicial</span>
            <span>Meta</span>
          </div>
        </div>

        <div class="meta-alert" id="mensagemMeta">
          
        </div>
      </div>
    </main>
  </body>
</html>

<script src="../js/sessao.js"></script>
<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  b_nome.innerHTML = sessionStorage.NOME_USUARIO;

  function recarregar(){
    
    fetch(`/dash/buscarDadosPerfil/${sessionStorage.ID_USUARIO}`)
    .then(function (resposta){
      return resposta.json()
    })
    .then(function (dados){
      console.log(dados);

      for(let i = 0; i < dados.length; i++){
        peso.innerHTML = dados[0].peso;
        altura.innerHTML = dados[0].altura;
        objetivo.innerHTML = dados[0].objetivo;
      }
    })
    .catch(function (erro){
        console.log("Erro ao buscar treino do dia:", erro)
      });


    let pesoInicialBanco;
    let pesoAtualBanco;
    let metaBanco;

    fetch(`/dash/buscarPesoInicial/${sessionStorage.ID_USUARIO}`)
    .then(res=>res.json())
    .then(dados=>{

      pesoInicialBanco = dados[0].peso;

      pesoInicial.innerHTML = `Início: ${pesoInicialBanco}kg`
    })


    fetch(`/dash/buscarMetaAtual/${sessionStorage.ID_USUARIO}`)
    .then(res=>res.json())
    .then(dados=>{
      
      pesoAtualBanco = dados[0].pesoAtual;
      metaBanco = dados[0].pesoMeta;

      metaPeso.innerHTML =
        `${metaBanco}<span>kg</span>`;

      let perdido = 
      pesoInicialBanco - pesoAtualBanco;

      mensagemMeta.innerHTML=
      `🎯 Você já perdeu <strong>${perdido}kg!</strong> Continue assim`;

      let porcentagem =
      (perdido / (pesoInicialBanco - metaBanco))*100;

      barra.style.width =
      porcentagem + "%";
    })
  }
  
</script>
